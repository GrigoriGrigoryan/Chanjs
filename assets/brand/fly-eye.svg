<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Original Chanjs fly head: compound eyes, antennae, a plated face and a long proboscis. -->
  <defs>
    <linearGradient id="eye" x1="20" y1="27" x2="46" y2="91" gradientUnits="userSpaceOnUse"><stop stop-color="#ef4b5a"/><stop offset=".45" stop-color="#c32643"/><stop offset="1" stop-color="#740e2e"/></linearGradient>
    <linearGradient id="face" x1="56" y1="29" x2="73" y2="88" gradientUnits="userSpaceOnUse"><stop stop-color="#a1757d"/><stop offset=".38" stop-color="#47303d"/><stop offset="1" stop-color="#b96b77"/></linearGradient>
    <linearGradient id="trunk" x1="60" y1="79" x2="68" y2="119" gradientUnits="userSpaceOnUse"><stop stop-color="#eaa6a5"/><stop offset=".5" stop-color="#b55766"/><stop offset="1" stop-color="#f4b5ae"/></linearGradient>
    <path id="eyeShape" d="M17 28c12-7 29-1 38 13l-2 28c-1 14-9 24-21 24C16 93 7 79 7 60c0-13 3-25 10-32Z"/>
    <clipPath id="eyeClip"><use href="#eyeShape"/></clipPath>
    <pattern id="facets" width="13" height="15" patternUnits="userSpaceOnUse"><path d="m0 3.75 6.5-3.75L13 3.75v7.5L6.5 15 0 11.25v-7.5Zm6.5 0 6.5 3.75-6.5 3.75L0 7.5l6.5-3.75Z" stroke="#ffb3b0" stroke-opacity=".22" stroke-width=".7"/></pattern>
  </defs>
  <!-- The antennae break the upper silhouette; eye lobes end in rounded cheeks. -->
  <path d="m58 29-7-13-12-7m31 20 7-13 12-7" stroke="#b86c7a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m39 9-5 1m55-1 5 1" stroke="#efaaa9" stroke-width="3" stroke-linecap="round"/>
  <path d="M64 22c12 0 17 17 16 37l-7 31H55l-7-31c-1-20 4-37 16-37Z" fill="#211720" stroke="#6c4655" stroke-width="2"/>
  <use href="#eyeShape" fill="url(#eye)" stroke="#421021" stroke-width="2"/>
  <g clip-path="url(#eyeClip)"><path d="M4 24h55v74H4z" fill="url(#facets)"/><path d="M14 35c9-9 23-3 29 3" stroke="#ff898e" stroke-opacity=".66" stroke-width="3" stroke-linecap="round"/><path d="M7 57c5 14 12 26 26 34" stroke="#520e26" stroke-opacity=".5" stroke-width="6"/></g>
  <g transform="translate(128 0) scale(-1 1)"><use href="#eyeShape" fill="url(#eye)" stroke="#421021" stroke-width="2"/><g clip-path="url(#eyeClip)"><path d="M4 24h55v74H4z" fill="url(#facets)"/><path d="M14 35c9-9 23-3 29 3" stroke="#ff898e" stroke-opacity=".66" stroke-width="3" stroke-linecap="round"/><path d="M7 57c5 14 12 26 26 34" stroke="#520e26" stroke-opacity=".5" stroke-width="6"/></g></g>
  <!-- Inward brows and the central face remain distinct when the mark is small. -->
  <path d="m17 26 20 3 18 12m56-15-20 3-18 12" stroke="#180f19" stroke-width="5" stroke-linecap="round"/>
  <path d="m64 29 9 15-2 27-7 12-7-12-2-27 9-15Z" fill="url(#face)" stroke="#1a121b" stroke-width="2"/>
  <path d="m64 36 3 11-3 12-3-12 3-11Z" fill="#e4a9a5" fill-opacity=".72"/>
  <path d="m55 73-6 10m24-10 6 10" stroke="#d0828d" stroke-width="3" stroke-linecap="round"/>
  <path d="M58 80h12l-2 32 3 6-4 5h-6l-4-5 3-6-2-32Z" fill="url(#trunk)" stroke="#21131e" stroke-width="2" stroke-linejoin="round"/>
  <path d="M60 90h8m-7 10h6m-6 10h6m-3 4v7" stroke="#612839" stroke-width="2" stroke-linecap="round"/>
</svg>
